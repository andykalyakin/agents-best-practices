name: artifact-preflight self-test
on:
  push:
    paths:
      - 'tools/artifact-preflight/**'
      - '.github/workflows/artifact-preflight.yml'
  pull_request:
    paths:
      - 'tools/artifact-preflight/**'
      - '.github/workflows/artifact-preflight.yml'
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic self-test
        run: node tools/artifact-preflight/artifact-preflight.mjs --self-test
      - name: Valdai known-bad regression
        run: node tools/artifact-preflight/test/regression-test.mjs
